<svg width="468" height="404" viewBox="0 0 468 404" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs></defs><g><ellipse cx="243" cy="20" rx="10" ry="10" stroke="#222222" fill="#222222"/><rect x="65" y="50" rx="12.5" ry="12.5" width="356" height="47.9375" stroke="#181818" stroke-width="0.5" fill="#F1F1F1"/><text font-family="Arial" font-size="12" x="75" y="71.1387">构建流处理作业并分析状态特征</text><text font-family="Arial" font-size="12" x="75" y="85.1074">映射物理执行计划，识别各算子状态类型、规模界限及访问模式</text><path d="M133 117.938 353 117.938 365 129.938 353 141.938 133 141.938 121 129.938 133 117.938Z" stroke="#181818" stroke-width="0.5" fill="#F1F1F1"/><text font-family="Arial" font-size="11" x="133" y="133.746">根据特征判定：状态是否可能增长为大状态？</text><text font-family="Arial" font-size="11" x="110" y="127.343">是</text><text font-family="Arial" font-size="11" x="365" y="127.343">否</text><rect x="11" y="151.938" rx="12.5" ry="12.5" width="200" height="33.9688" stroke="#181818" stroke-width="0.5" fill="#F1F1F1"/><text font-family="Arial" font-size="12" x="21" y="173.076">为该状态原语配置专用大状态后端</text><rect x="293" y="151.938" rx="12.5" ry="12.5" width="164" height="33.9688" stroke="#181818" stroke-width="0.5" fill="#F1F1F1"/><text font-family="Arial" font-size="12" x="303" y="173.076">为该状态原语配置内存后端</text><path d="M243 191.906 255 203.906 243 215.906 231 203.906 243 191.906Z" stroke="#181818" stroke-width="0.5" fill="#F1F1F1"/><rect x="54.7168" y="235.906" rx="12.5" ry="12.5" width="376.566" height="47.9375" stroke="#181818" stroke-width="0.5" fill="#F1F1F1"/><text font-family="Arial" font-size="12" x="64.7168" y="257.045">实例化带类型的存储实例并执行数据路由</text><text font-family="Arial" font-size="12" x="64.7168" y="271.014">为各原语创建独立 store，按 key 分区将输入记录发送至对应 task</text><rect x="69.6934" y="303.844" rx="12.5" ry="12.5" width="346.613" height="47.9375" stroke="#181818" stroke-width="0.5" fill="#F1F1F1"/><text font-family="Arial" font-size="12" x="79.6934" y="324.982">执行基于专用 API 的状态访问与后端协同维护</text><text font-family="Arial" font-size="12" x="79.6934" y="338.951">任务通过 API 执行状态读写，并结合算子语义执行清理与快照</text><ellipse cx="243" cy="382.781" rx="11" ry="11" stroke="#222222" fill="none"/><ellipse cx="243" cy="382.781" rx="6" ry="6" stroke="#222222" fill="#222222"/><line x1="243" y1="30" x2="243" y2="50" stroke="#181818"/><path d="M239 40 243 50 247 40 243 44Z" stroke="#181818" fill="#181818"/><line x1="121" y1="129.938" x2="111" y2="129.938" stroke="#181818"/><line x1="111" y1="129.938" x2="111" y2="151.938" stroke="#181818"/><path d="M107 141.938 111 151.938 115 141.938 111 145.938Z" stroke="#181818" fill="#181818"/><line x1="365" y1="129.938" x2="375" y2="129.938" stroke="#181818"/><line x1="375" y1="129.938" x2="375" y2="151.938" stroke="#181818"/><path d="M371 141.938 375 151.938 379 141.938 375 145.938Z" stroke="#181818" fill="#181818"/><line x1="111" y1="185.906" x2="111" y2="203.906" stroke="#181818"/><line x1="111" y1="203.906" x2="231" y2="203.906" stroke="#181818"/><path d="M221 199.906 231 203.906 221 207.906 225 203.906Z" stroke="#181818" fill="#181818"/><line x1="375" y1="185.906" x2="375" y2="203.906" stroke="#181818"/><line x1="375" y1="203.906" x2="255" y2="203.906" stroke="#181818"/><path d="M265 199.906 255 203.906 265 207.906 261 203.906Z" stroke="#181818" fill="#181818"/><line x1="243" y1="97.9375" x2="243" y2="117.938" stroke="#181818"/><path d="M239 107.938 243 117.938 247 107.938 243 111.938Z" stroke="#181818" fill="#181818"/><line x1="243" y1="215.906" x2="243" y2="235.906" stroke="#181818"/><path d="M239 225.906 243 235.906 247 225.906 243 229.906Z" stroke="#181818" fill="#181818"/><line x1="243" y1="283.844" x2="243" y2="303.844" stroke="#181818"/><path d="M239 293.844 243 303.844 247 293.844 243 297.844Z" stroke="#181818" fill="#181818"/><line x1="243" y1="351.781" x2="243" y2="371.781" stroke="#181818"/><path d="M239 361.781 243 371.781 247 361.781 243 365.781Z" stroke="#181818" fill="#181818"/></g></svg>